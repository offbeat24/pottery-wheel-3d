    description: >-
      수분과 RPM 테스트는 pure 함수의 일부 지점과 젖은색·마른색이 서로 다르다는 것만
      확인한다. E2E도 물을 100%로 만든 뒤 실제 profile 변화, 시간 경과 건조, 과건조·과습
      위험, 본체와 부속물의 색과 거칠기를 검증하지 않는다. src/main.ts 599-656과
      1336-1348의 shapingEfficiency, updateMoisture, updateClayMaterial 연결이 빠져도 단위
      테스트는 통과한다.
    impact: >-
      수분과 물레 속도가 실제 성형 효율 및 구조 위험에 작용하고 시각적으로 마르는 핵심
      재료 인과가 회귀해도 테스트가 탐지하지 못한다.
    verification: >-
      src/main.ts에서 shapingEfficiency 적용이나 updateClayMaterial 호출을 제거해도 현재
      tests/process.test.ts는 여전히 pure 함수만 호출하므로 통과 가능한지 대조한다.
    suggested_fix: >-
      동일 입력을 저속·적정속도와 건조·적정·과습에서 실행해 실제 profile delta와 구조
      위험 차이를 검증한다. 시간 경과 후 moisture 감소와 렌더 material 색·roughness 변경,
      단계 밖 물 추가 불가를 확인하고 0, 0.12, 0.34, 0.72, 0.82, 0.92, 1 경계값을 추가한다.

