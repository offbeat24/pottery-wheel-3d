      추가됐을 때 활성화 범위가 달라졌다는 사실도 드러나지 않는다.
    verification: >-
      npm run bass -- agent guide REALISM-001 --json을 실행해 project.profiles에 server가
      포함되고, task의 forbidden scope에는 서버와 운영 데이터가 제외되어 있는지 비교한다.
    suggested_fix: >-
      기본 profile과 현재 task를 common/web 범위로 맞추고, 서버나 DB 변경이 실제 task
      범위에 들어올 때만 server profile을 활성화한다.

  - severity: medium
    confidence: confirmed
