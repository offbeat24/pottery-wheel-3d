    impact: >-
      제거한 기능의 UI, 상태, 계산과 테스트가 남지 않아야 한다는 명시적 수용 조건에 자동
      회귀 방어가 없다. 이후 변경에서 복잡한 공정 상태가 조용히 되살아나도 형태 맞추기
