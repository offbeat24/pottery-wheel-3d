critic: design
task_id: REALISM-001
iteration: 8
no_issues_found: false
findings:
  - severity: medium
    confidence: confirmed
    category: design
    evidence:
      file: src/main.ts
      location: lines 98-130 and 1175-1186 (intro dialog and result-view transition)
    description: >-
      iteration 7의 dialog semantics, 결과 모달 진입 focus, 다시 빚기/다음 주문 focus 복원은
      반영됐지만 두 진입 경계가 남아 있다. 초기 intro가 aria-modal dialog로 열린 상태에서
      첫 행동으로 focus를 보내지 않으며, `3D 전체 보기`는 focus된 result-view-button을 포함한
      결과 모달을 숨긴 뒤 새로 보이는 result-summary-button으로 focus를 이동하지 않는다.
      별도 포트의 1440x900 Chromium에서 초기 activeElement와 전체 보기 진입 직후
      activeElement가 모두 BODY인 것을 확인했다.
    impact: >-
      키보드와 보조기술 사용자는 앱 진입 시 modal dialog 안에 들어왔다는 조작 경계를 즉시
      알 수 없고, 전체 보기로 전환하면 focus 맥락을 잃는다. 특히 전체 보기에서 보이는 유일한
      DOM 행동인 `결과표 보기`를 다시 탐색해야 하므로 결과 확인 루프의 접근 가능한 상태
      전환이 아직 완결되지 않는다.
    verification: >-
      페이지를 새로 열어 intro-modal이 보일 때 document.activeElement를 확인한다. 첫 주문을
      시작하고 형태 결과에서 `3D 전체 보기`를 누른 직후 다시 activeElement를 확인한다.
      현재는 두 시점 모두 BODY이며, Tab을 눌러야 첫 주문 시작 또는 결과표 보기로 이동한다.
    suggested_fix: >-
      초기 렌더가 끝난 뒤 start-button에 focus를 주고, 전체 보기 진입 시
      result-summary-button으로 focus를 옮긴다. 결과표로 돌아올 때 result-view-button으로
      복원하는 현재 동작은 유지하고, E2E에 세 전환의 activeElement 단언을 추가한다.
