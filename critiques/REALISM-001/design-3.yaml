      제품이 현실적인 공정어와 분위기 문구 중 어느 쪽을 정보 기준으로 삼는지 혼란스럽다.
    verification: >-
      처음 플레이하는 사용자에게 성형-건조-시유-소성 순서를 현재 화면 용어만으로
      설명하게 하고, 각 영문 레이블이 행동 결정에 어떤 정보를 주는지 확인한다.
    suggested_fix: >-
      화면 본문은 물레 성형·가죽경도 건조·다듬기·시유·초벌/재벌 소성처럼 일관된 실제
      도예 용어로 통일하고, 짧은 정의와 조작법은 우상단 도움말 패널에 계층화한다. 시적
      문구는 브랜드 영역과 결과 격려에만 제한한다.
