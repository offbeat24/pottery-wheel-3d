  - severity: medium
    confidence: confirmed
    category: test
    evidence:
      file: tests/process.test.ts
      location: lines 21-31, 43-57, 83-85
    description: >-
      새 테스트는 성형 종료 시 수분 보존, 비활성 건조의 무변화, 활성 건조의 수분 감소와
      18% 가죽경도 도달을 검증하고 E2E도 동일 전이를 통과한다. 그러나 수분과 RPM이 실제
      성형 profile 변화와 구조 위험에 미치는 통합 효과, 건조 중 본체·추가 흙·손잡이의
      연속적인 색과 roughness 변화는 여전히 검증하지 않는다. wetClayColor의 두 반환값이
      다르다는 pure assertion만 있어 src/main.ts의 shapingEfficiency 또는 updateClayMaterial
      연결이 빠져도 테스트가 통과한다.
    impact: >-
      건조 상태 숫자는 정상적으로 변해도 사용자가 보아야 할 연속적인 표면 변화가 없거나,
      수분과 물레 속도가 실제 성형에 작용하지 않는 회귀를 탐지하지 못한다.
    verification: >-
      E2E가 data-moisture 100과 최종 18만 확인하고 중간 수분의 material 색·roughness나
      profile delta를 읽지 않는지, tests/process.test.ts가 순수 함수만 호출하는지 대조한다.
    suggested_fix: >-
      건조 시작 전·중간·가죽경도의 재료 상태를 테스트 가능한 값으로 노출하거나 렌더 단위로
      본체와 부속물 색·roughness의 단조 변화를 검증한다. 동일 성형 입력을 저속·적정속도와
      건조·적정·과습에서 실행해 실제 profile delta와 위험 차이를 확인하고 RPM·수분 경계값을
      테이블 테스트로 추가한다.

  - severity: medium
    confidence: confirmed
    category: test
    evidence:
      file: e2e/quality.spec.ts
      location: lines 97-105, 145-158
    description: >-
      E2E는 건조 시작 전 유약 버튼이 잠겼는지 확인하지만 건조 버튼을 누른 직후부터
      가죽경도에 도달하기 전까지 잠금이 계속 유지되는지는 검사하지 않는다. unit도 drying
      상태에서 applyGlaze가 거부되는 경로와 updateDrying의 다른 stage, 음수 delta, 정확한
      임계 경계를 직접 검증하지 않는다.
    impact: >-
      건조 시작과 동시에 또는 중간 수분에서 마감이 조기에 열리는 회귀가 생겨도 최종
      leather-hard만 기다리는 현재 E2E는 통과할 수 있다. "가죽경도에 도달해야 마감 선택이
      열린다"는 단계 경계가 완전히 보장되지 않는다.
    verification: >-
      e2e/quality.spec.ts에서 drying-action 클릭 후 data-drying-active만 확인하고 곧바로 최종
      stage를 poll하며, 중간 수분에서 glaze disabled assertion이 없는지 확인한다.
    suggested_fix: >-
      건조 시작 후 수분이 18%보다 높은 중간 상태를 poll해 유약·무유약·소성 행동이 계속
      잠겼는지 확인한 뒤, leather-hard 전환 직후에만 열리는지 검증한다. unit에는 drying
      상태의 applyGlaze 거부와 updateDrying의 inactive/non-drying/negative/exact-threshold
      경계를 표로 추가한다.

