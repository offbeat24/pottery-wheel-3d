  - severity: medium
    confidence: confirmed
    category: design
    evidence:
      file: src/visuals/workshop.ts
      location: waterBowl 구성
    description: >-
      물그릇 몸통을 위가 막힌 CylinderGeometry로 만들어 뚜껑면이 물 표면을 덮었다.
      1440×900 실제 렌더에서 그릇이 아니라 갈색 통짜 덩어리로 보이고 물이 전혀 보이지 않았다.
    impact: >-
      물그릇이 물이 담긴 그릇으로 읽히지 않으므로 클릭해 스펀지를 적신다는 흐름이 설명 없이 이해되지 않는다.
    verification: >-
      1440×900 실제 렌더 스크린샷을 확대해 물 표면(청색 원)이 보이는지 확인한다.
    suggested_fix: >-
      벽만 세운 openEnded 원기둥으로 바꾸고 바닥 원과 물 표면을 따로 넣는다.
    resolution: 적용 완료 — openEnded 벽 + 바닥 원 + 물 표면으로 분리했다.

