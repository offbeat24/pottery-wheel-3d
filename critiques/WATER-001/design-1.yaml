      클릭은 되지만 물건이 잘려 보인다.
    impact: 조작할 수 있어도 가려져 있으면 없는 물건으로 읽힌다.
    verification: 1440×900 렌더에서 물그릇 전체가 HUD 위에 드러나는지 확인한다.
    suggested_fix: 물레 오른쪽 옆(뒤쪽으로 당긴 자리)으로 옮긴다.
    resolution: 적용 완료 — (1.86, 0.4, 0.02)로 옮겨 하단 패널 위로 완전히 드러난다.

