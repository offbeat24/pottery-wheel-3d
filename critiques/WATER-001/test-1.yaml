  - severity: high
    confidence: confirmed
    category: test
    evidence:
      file: e2e/water-001.spec.ts
      location: 최초 작성본
    description: >-
      "성형·카메라 조작과 포인터 충돌이 없다"는 인수 조건 중, 스펀지를 든 동안 같은 좌드래그가
      흙을 밀지 않는지는 어느 테스트도 확인하지 않았다. 내려놓은 뒤 성형이 되는지만 확인했다.
    impact: >-
      applyContinuousShaping의 holdingSponge() 가드가 사라져 물 바르기와 성형이 동시에
      일어나도 테스트는 통과한다. 이 가드가 이 기능의 충돌 방지 핵심이다.
    verification: >-
      가드를 지우고 같은 E2E를 돌려 실패하는지 대조한다.
    suggested_fix: >-
      스펀지를 든 상태로 점토를 좌드래그한 뒤 최대 폭이 그대로인지 확인한다.
    resolution: >-
      적용 완료 — 수분이 이미 100%인 지점에서(물이 더 들어가지 않아 조건이 깨끗하다)
      좌드래그 후 최대 폭 불변을 확인한다.

  - severity: medium
