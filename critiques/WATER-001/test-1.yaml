    description: >-
      물그릇을 화면 비율 좌표로 클릭하기만 하면, 물그릇이 HUD에 가려지거나 화면 밖으로 나가도
      raycast는 성공해 테스트가 통과한다. 보이지 않는 물건도 통과시킨다.
    impact: 인수 조건 "1440×900에서 물그릇이 자연스럽게 보인다"가 회귀해도 탐지되지 않는다.
    verification: 물그릇 위에서 커서가 pointer로 바뀌는지, 벗어나면 되돌아오는지 확인한다.
    suggested_fix: 클릭 전에 hover 커서 상태를 함께 고정한다.
    resolution: 적용 완료 — hover 시 pointer, 벗어나면 pointer 아님을 함께 확인한다.

  - severity: low
